<div>
    <h1>{{product().name}}</h1>
    <p>Hay en Stock: {{product().exist}}</p>
    <p>Precio: {{product().price}}</p>
    <div style="display: flex;gap: 1rem;">
        <button (click)="updateProductPrice()">Aumentar Precio</button>
        <button (click)="toggleExist()">Sin Stock</button>
        <button (click)="changeProduct()">Cambiar Producto</button>
    </div>
</div>
